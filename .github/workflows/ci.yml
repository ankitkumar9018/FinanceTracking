name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        # xhtml2pdf → svglib → rlpycairo → pycairo builds against the system
        # cairo lib (no manylinux wheel), so it must be present or `uv sync` fails.
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install dependencies
        working-directory: backend
        # --extra cas so the CAS-import mapping tests exercise the real casparser
        # path in CI instead of skipping.
        run: uv sync --extra dev --extra cas

      - name: Lint with ruff
        working-directory: backend
        run: uv run ruff check app/

      - name: Type check with mypy
        working-directory: backend
        run: uv run mypy app/ --ignore-missing-imports

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v --cov=app --cov-report=xml

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json — specifying it here
        # too makes pnpm/action-setup@v4 fail with "Multiple versions specified".

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm --filter @finance-tracker/web build

  e2e-tests:
    name: E2E Tests
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json — specifying it here
        # too makes pnpm/action-setup@v4 fail with "Multiple versions specified".

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install system dependencies
        # cairo for pycairo (xhtml2pdf chain) — see the backend job.
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install all dependencies
        run: |
          cd backend && uv sync
          cd .. && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @finance-tracker/web exec playwright install --with-deps chromium

      - name: Setup database
        working-directory: backend
        run: |
          cp .env.example .env
          uv run alembic upgrade head
        env:
          # Migrate the SAME database the backend serves from (below), otherwise
          # the backend starts against an un-migrated test_e2e.db.
          DATABASE_URL: "sqlite+aiosqlite:///./test_e2e.db"

      - name: Start backend
        working-directory: backend
        run: uv run uvicorn app.main:app --port 8000 &
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_e2e.db"
          SECRET_KEY: "e2e-test-secret-key-not-for-production"

      - name: Start frontend
        # Point the web app at the e2e backend (port 8000); without these it
        # defaults to :8420 and every API/WS call fails.
        run: pnpm --filter @finance-tracker/web dev --port 3000 &
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000"

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready (attempt $i)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start after 60 seconds"
              exit 1
            fi
            sleep 1
          done
          echo "Waiting for frontend..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready (attempt $i)"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Frontend failed to start after 60 seconds"
              exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        run: pnpm --filter @finance-tracker/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  desktop-build:
    # The desktop shell was never compiled in CI: a Rust change that does not
    # build, or a static export that does not produce apps/web/out, only showed
    # up when someone pushed a release tag (or built an installer by hand).
    # This job does exactly the two steps the release workflow depends on —
    # STATIC_EXPORT of the web app, then compiling src-tauri against it — plus
    # the Rust unit tests for the sidecar-reaping logic.
    name: Desktop Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json — specifying it here
        # too makes pnpm/action-setup@v4 fail with "Multiple versions specified".

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies
        # Tauri v2 on Linux links against webkit2gtk 4.1 and friends.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libcairo2-dev pkg-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend for desktop
        # This is the export the desktop app actually ships — different config
        # from the regular `pnpm build` the frontend job runs.
        run: STATIC_EXPORT=true pnpm --filter @finance-tracker/web build
        env:
          STATIC_EXPORT: 'true'

      - name: Stage static frontend
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          rm -rf apps/desktop/dist
          cp -r apps/web/out apps/desktop/dist
          # tauri.conf.json declares an externalBin; a placeholder with the
          # right target-triple suffix is enough to compile (we are not
          # bundling an installer here, only type-checking the shell).
          mkdir -p apps/desktop/src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > apps/desktop/src-tauri/binaries/financetracker-backend-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/financetracker-backend-x86_64-unknown-linux-gnu

      - name: Compile desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets --locked

      - name: Desktop shell unit tests
        working-directory: apps/desktop/src-tauri
        # Covers the stale-sidecar reaping rules (identity + owner checks) and
        # the startup-recovery page, which are easy to regress and impossible to
        # notice until an installed app misbehaves on a user's machine.
        run: cargo test --locked
