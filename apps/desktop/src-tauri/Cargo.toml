[package]
name = "finance-tracker-desktop"
version = "0.1.0"
edition = "2021"
description = "FinanceTracker Desktop App"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": right-click -> Inspect Element in RELEASE builds. Windows release
# builds hide the console (windows_subsystem = "windows"), so without this a
# white screen on Windows is completely undiagnosable.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
